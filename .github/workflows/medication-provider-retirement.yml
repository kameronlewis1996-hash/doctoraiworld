name: Medication provider retirement checks

on:
  pull_request:
    paths:
      - 'api/medication/**'
      - 'api/auth/google.js'
      - 'api/health/state.js'
      - 'api/documents.js'
      - 'server-src/_lib/doctorai-core.cjs'
      - 'data/medication/**'
      - 'docs/nz-medication-database.md'
      - '.env.example'
      - 'health-hub.css'
      - 'health-hub.html'
      - 'health-hub.js'
      - 'medicine-catalog-search.js'
      - 'term-catalogues.js'
      - 'hub-category-themes.css'
      - 'hub-navigation.css'
      - 'aurora-theme.css'
      - 'welcome.css'
      - 'index.html'
      - 'medication-check-controller.js'
      - 'medication-list-template.html'
      - 'privacy.html'
      - 'public-mcp/api/mcp.js'
      - 'scripts/verify-medication-*'
      - 'scripts/verify-local-medication-ui.cjs'
      - 'scripts/verify-retired-medication-providers.cjs'
      - 'scripts/verify-static-site.ps1'
      - 'scripts/verify-server-core.js'
      - 'scripts/verify-health-state-contract.cjs'
      - 'scripts/verify-record-preparation.cjs'
      - 'scripts/verify-document-delete.cjs'
      - 'scripts/verify-document-ui-correction.cjs'
      - 'scripts/verify-document-upload-races.cjs'
      - 'scripts/verify-document-upload-api.cjs'
      - '.github/workflows/medication-provider-retirement.yml'
      - 'scripts/csp-hashes.js'
      - 'service-worker.js'
      - 'package.json'
      - '.node-version'
      - 'scripts/verify-node-runtime.cjs'
      - 'scripts/dev-node.ps1'
      - 'subscription.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medication-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          check-latest: true
      - name: Verify patched development/build runtime
        run: node scripts/verify-node-runtime.cjs
      - name: Verify changed JavaScript syntax
        run: |
          node scripts/check-js.js
          node --check health-hub.js
          node --check medicine-catalog-search.js
          node --check scripts/verify-medication-catalog-search.cjs
          node --check 'api/medication/[...action].js'
          node --check scripts/verify-medication-safety.js
          node --check scripts/verify-medication-staff-test.cjs
          node --check server-src/staff/medication-clash-test.cjs
          node --check 'api/staff/[...action].js'
          node --check staff-medication-tests.js
          node --check scripts/verify-medication-database.cjs
          node --check scripts/verify-medication-pipeline.cjs
          node --check scripts/verify-medication-evidence.cjs
          node --check scripts/measure-medication-pipeline.cjs
          node --check scripts/verify-medication-scan.js
          node --check scripts/verify-local-medication-ui.cjs
          node --check scripts/verify-retired-medication-providers.cjs
          node --check scripts/verify-server-core.js
          node --check scripts/verify-health-state-contract.cjs
          node --check scripts/verify-record-preparation.cjs
      - name: Verify record preparation and private health state
        run: |
          node scripts/verify-server-core.js
          node scripts/verify-health-state-contract.cjs
          node scripts/verify-medication-catalog-search.cjs
          node scripts/verify-five-tabs.cjs
          node scripts/verify-record-preparation.cjs
          node scripts/verify-document-delete.cjs
          node scripts/verify-document-ui-correction.cjs
          node scripts/verify-document-upload-races.cjs
          node scripts/verify-document-upload-api.cjs
      - name: Run local medication and scan regressions
        run: |
          node scripts/verify-medication-safety.js
          node scripts/verify-medication-staff-test.cjs
          node scripts/verify-medication-database.cjs
          node scripts/verify-medication-pipeline.cjs
          node scripts/verify-medication-evidence.cjs
          node scripts/verify-medication-check-controller.cjs
          node scripts/verify-medication-login.cjs
          node scripts/verify-local-medication-ui.cjs
          node scripts/verify-retired-medication-providers.cjs
          node scripts/verify-medication-scan.js
      - name: Verify the production static site
        shell: pwsh
        run: ./scripts/verify-static-site.ps1
