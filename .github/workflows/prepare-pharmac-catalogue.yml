name: Prepare Pharmac catalogue review

on:
  workflow_dispatch:
    inputs:
      effective_date:
        description: "Optional Pharmac effective date (YYYY-MM-01); blank selects next month in UTC"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and validate candidate
        env:
          EFFECTIVE_DATE: ${{ inputs.effective_date }}
        run: |
          args=()
          if [[ -n "$EFFECTIVE_DATE" ]]; then
            args+=(--effective-date "$EFFECTIVE_DATE")
          fi
          python3 scripts/prepare-pharmac-catalogue.py \
            "${args[@]}" \
            --report-file "$RUNNER_TEMP/pharmac-catalogue-review.md"

      - name: Set candidate metadata
        id: candidate
        run: |
          if git diff --quiet -- data/medication/nz-pharmac-medicines.json data/medication/nz-medicine-names.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalogue change to propose."
            exit 0
          fi
          version="$(python3 -c 'import json; print(json.load(open("data/medication/nz-pharmac-medicines.json"))["datasetVersion"])')"
          branch="automation/pharmac-catalogue-$version"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create draft review pull request
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/medication/nz-pharmac-medicines.json data/medication/nz-medicine-names.json
          git commit -m "Prepare Pharmac catalogue $VERSION for review"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "Review NZ medicine catalogue $VERSION" \
            --body-file "$RUNNER_TEMP/pharmac-catalogue-review.md"
