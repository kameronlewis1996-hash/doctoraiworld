<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DoctorAI World Medical Research Explorer</title>
  <desc id="desc">A DoctorAI World research explorer card with blank sections for recent papers, publication dates and original sources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
    <filter id="paper-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17476b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1090" cy="-20" r="260" fill="#bceeff" opacity=".55"/>
  <circle cx="80" cy="620" r="240" fill="#d4f5ff" opacity=".65"/>
  <image href="doctorai-public-logo-transparent.png?v=10" x="68" y="42" width="220" height="110" preserveAspectRatio="xMidYMid meet" aria-label="DoctorAI World logo"/>
  <rect x="72" y="177" width="306" height="42" rx="21" fill="#e0f3fc"/>
  <text x="94" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.1" fill="#126aa5">FREE RESEARCH EXPLORER</text>
  <text x="70" y="286" font-family="Arial, sans-serif" font-size="45" font-weight="700" letter-spacing="-1.1" fill="#0b2346">Explore medical research</text>
  <text x="72" y="344" font-family="Arial, sans-serif" font-size="37" font-weight="600" fill="#18344d">with original-source links</text>
  <text x="74" y="410" font-family="Arial, sans-serif" font-size="21" fill="#35566e">Papers, dates and different starting points.</text>
  <text x="74" y="554" font-family="Arial, sans-serif" font-size="18" fill="#5e8197">For learning — not self-diagnosis.</text>
  <g transform="translate(790 86)" filter="url(#paper-shadow)">
    <rect width="330" height="454" rx="25" fill="#ffffff"/>
    <rect x="31" y="31" width="48" height="7" rx="3.5" fill="#126aa5"/>
    <text x="31" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#526b80">RESEARCH NOTES</text>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#126aa5">
      <text x="31" y="145">RECENT PAPERS</text>
      <text x="31" y="249">PUBLICATION DATES</text>
      <text x="31" y="353">ORIGINAL SOURCES</text>
    </g>
    <g stroke="#d8e6f0" stroke-width="3" stroke-linecap="round">
      <path d="M31 170H292 M31 194H260"/>
      <path d="M31 274H292 M31 298H260"/>
      <path d="M31 378H292 M31 402H260"/>
    </g>
  </g>
</svg>
