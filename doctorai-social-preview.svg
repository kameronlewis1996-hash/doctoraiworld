<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DoctorAI Personal Health Hub</title>
  <desc id="desc">DoctorAI health hub for medications, appointments, results, documents and everyday health organisation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1050" cy="-30" r="280" fill="#bceeff" opacity=".52"/>
  <circle cx="1120" cy="600" r="230" fill="#d4f5ff" opacity=".72"/>
  <!-- The public logo is the exact canonical DoctorAI asset used by the site. -->
  <image href="https://www.doctoraiworld.com/doctorai-public-logo-transparent.png?v=9" x="82" y="95" width="390" height="250" preserveAspectRatio="xMidYMid meet"/>
  <text x="92" y="414" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#0b2346">Your health, at a glance.</text>
  <text x="96" y="477" font-family="Arial, sans-serif" font-size="27" fill="#35566e">Medications · appointments · results · documents</text>
  <text x="96" y="525" font-family="Arial, sans-serif" font-size="20" fill="#5e8197">Health organisation and education — not medical care.</text>
</svg>
